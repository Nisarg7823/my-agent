services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-voice}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?copy .env.example to .env}
      POSTGRES_DB: ${POSTGRES_DB:-voiceagent}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: ghcr.io/amacneil/dbmate:v2.36.0
    depends_on:
      db: { condition: service_healthy }
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-voice}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-voiceagent}?sslmode=disable
      DBMATE_NO_DUMP_SCHEMA: "true"
      DBMATE_WAIT: "true"
    volumes: ["./db:/db"]
    command: up
    restart: "no"

volumes:
  pgdata: